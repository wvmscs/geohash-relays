# cargo deny check (also in CI): known vulnerabilities, licences of the
# dependencies, where they come from.

[advisories]
# Unmaintained crates: reported for direct dependencies only.
unmaintained = "workspace"
ignore = []

[licenses]
# Compatible with this crate's licence (Unlicense OR 0BSD).
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "0BSD", "Unlicense", "CC0-1.0", "BSL-1.0"]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
