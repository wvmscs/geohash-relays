[package]
name = "geohash-relays"
version = "0.1.0"
edition = "2024"
description = "Relay selection for BitChat location channels (geohash): the iOS and Android rules, neighbours, and pluggable strategies."
license = "Unlicense OR 0BSD"
repository = "https://github.com/wvmscs/geohash-relays"

# Own workspace: the crate builds on its own, also inside the local `Nostr/`
# directory, whose workspace does not list it.
[workspace]

[dependencies]
# SHA-256: list digests (A0), rendezvous hashing (A1).
sha2 = "0.10"
thiserror = "2"
